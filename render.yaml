# render blueprint for the backend (new -> blueprint -> pick this repo)
# render asks for the sync: false values when you create it
services:
  - type: web
    name: studyai-api
    runtime: python
    plan: free
    region: ohio            # same region as the neon db
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # migrations run on every start, pre-deploy needs a paid plan
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL          # neon connection string
        sync: false
      - key: CORS_ORIGINS          # vercel url
        sync: false
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM            # sender verified in brevo
        sync: false
      - key: EMAIL_FROM_NAME
        value: Syllabo
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODEL     # used if the main model is busy
        value: gemini-3.1-flash-lite
